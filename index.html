<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Билайн Аналитика | Дашборд (Firebase)</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-color: #1c1c1c;
            --card-bg: #2b2b2b;
            --primary-yellow: #ffcc00;
            --primary-blue: #0055aa;
            --text-white: #ffffff;
            --text-dark: #2c2c2c;
            --text-gray: #b3b3b3;
            --border-color: #444;
            --shadow: 0 4px 20px rgba(0,0,0,0.6);
            --radius-md: 12px;
            --radius-full: 50px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        body { background-color: var(--bg-color); color: var(--text-white); padding: 20px; min-height: 100vh; overflow-x: hidden; }
        .dashboard-container { max-width: 1600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .logo-area h1 { font-size: 30px; font-weight: 800; color: var(--primary-yellow); letter-spacing: 0.5px; }
        .logo-area p { color: var(--text-gray); font-size: 14px; margin-top: 4px; }
        .controls-area { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .upload-section { background: var(--card-bg); padding: 8px 16px; border-radius: var(--radius-full); box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; border: 1px solid var(--border-color); position: relative; }
        .btn-primary { background: var(--primary-yellow); border: none; padding: 9px 24px; border-radius: 40px; color: var(--bg-color); font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-primary:hover { opacity: 0.9; transform: scale(1.05); }
        .btn-primary:disabled { background: var(--text-gray); cursor: not-allowed; opacity: 0.5; transform: none; }
        .file-info { font-size: 12px; font-weight: 600; color: var(--primary-yellow); }
        .admin-controls { display: flex; gap: 10px; }
        .btn-admin { background: transparent; border: 1px solid var(--text-gray); color: var(--text-gray); padding: 8px 16px; border-radius: var(--radius-full); font-size: 12px; cursor: pointer; transition: 0.2s; }
        .btn-admin:hover { border-color: var(--primary-yellow); color: var(--primary-yellow); }
        .btn-logout { background: #ff4444; color: white; border: none; padding: 8px 16px; border-radius: var(--radius-full); font-size: 12px; cursor: pointer; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .kpi-card { background: var(--card-bg); border-radius: var(--radius-md); padding: 20px; border-left: 4px solid var(--primary-yellow); box-shadow: var(--shadow); }
        .kpi-card h3 { font-size: 13px; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .kpi-value { font-size: 36px; font-weight: 800; color: var(--primary-yellow); line-height: 1; }
        .kpi-sub { font-size: 11px; color: #888; margin-top: 8px; }
        .filters-bar { background: var(--card-bg); border-radius: var(--radius-md); padding: 20px; margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .filter-group { display: flex; flex-direction: column; gap: 8px; min-width: 180px; flex: 1; }
        .filter-group label { font-size: 11px; font-weight: 700; color: var(--primary-yellow); text-transform: uppercase; letter-spacing: 0.5px; }
        .filter-select { background: var(--bg-color); color: var(--text-white); padding: 12px 16px; border-radius: 40px; border: 1px solid var(--border-color); font-size: 14px; outline: none; width: 100%; cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; }
        .filter-select option { background: var(--card-bg); color: var(--text-white); }
        .reset-filters { background: transparent; color: var(--text-gray); border: 1px solid var(--border-color); padding: 11px 24px; border-radius: 40px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .reset-filters:hover { border-color: var(--text-white); color: var(--text-white); }
        .charts-stack { display: flex; flex-direction: column; gap: 30px; }
        .chart-card { background: var(--card-bg); border-radius: var(--radius-md); padding: 25px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .chart-card h3 { font-size: 18px; font-weight: 700; color: var(--text-white); margin: 0; }
        canvas { width: 100% !important; height: 350px !important; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: flex; justify-content: center; align-items: center; color: var(--primary-yellow); font-size: 18px; display: none; }
        .loading-overlay.active { display: flex; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: var(--radius-md); border: 1px solid var(--border-color); text-align: center; min-width: 300px; max-width: 90%; width: 400px; box-shadow: 0 0 30px rgba(255, 204, 0, 0.3); position: relative; z-index: 4000; }
        .modal-content *, .modal-content input, .modal-content button { pointer-events: auto; }
        .modal-content h3 { margin-bottom: 20px; color: var(--primary-yellow); font-size: 24px; }
        .modal-content input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-white); font-size: 16px; box-sizing: border-box; text-align: center; outline: none; border: 2px solid transparent; transition: 0.3s; }
        .modal-content input:focus { border-color: var(--primary-yellow); }
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .controls-area { width: 100%; flex-direction: column; align-items: stretch; }
            .upload-section { justify-content: center; }
            .filter-group { width: 100%; }
        }
    </style>
</head>
<body class="dark-mode">
<div class="dashboard-container">
    <div class="header">
        <div class="logo-area">
            <h1>📊 Билайн | Аналитика</h1>
            <p>Фонограммы | Ошибки | Типы COPC</p>
        </div>
        <div class="controls-area">
            <div id="authControls" class="admin-controls">
                <button id="loginBtn" class="btn-admin">🔐 Админ</button>
                <button id="logoutBtn" class="btn-admin btn-logout" style="display: none;">🚪 Выйти</button>
            </div>
            <div id="uploadSection" class="upload-section" style="display: none;">
                <input type="file" id="uploadFileInput" accept=".xlsx, .xls, .csv, .xlsm" style="display: none;">
                <button id="loadFileBtn" class="btn-primary">📂 Загрузить в облако</button>
                <span id="uploadStatus" class="file-info"></span>
            </div>
        </div>
    </div>
    <div class="kpi-grid" id="kpiContainer">
        <div class="kpi-card"><h3>📅 Месяцев</h3><div class="kpi-value">—</div></div>
        <div class="kpi-card"><h3>⚠️ Сумма ошибок (шт.)*</h3><div class="kpi-value">—</div><div class="kpi-sub">*без "-" в критичности</div></div>
        <div class="kpi-card"><h3>📉 Средний % отклонений</h3><div class="kpi-value">—%</div></div>
        <div class="kpi-card"><h3>📌 Уникальных групп</h3><div class="kpi-value">—</div></div>
    </div>
    <div class="filters-bar">
        <div class="filter-group"><label>📆 Месяц</label><select id="filterMonth" class="filter-select"><option value="all">Все месяцы</option></select></div>
        <div class="filter-group"><label>🗂 Группа ошибок</label><select id="filterGroup" class="filter-select"><option value="all">Все группы</option></select></div>
        <div class="filter-group"><label>⚠️ Критичность</label><select id="filterCritical" class="filter-select"><option value="all">Все</option></select></div>
        <div class="filter-group"><label>📡 Тип COPC</label><select id="filterType" class="filter-select"><option value="all">Все типы</option></select></div>
        <button id="resetFiltersBtn" class="reset-filters">Сбросить</button>
    </div>
    <div class="charts-stack" id="chartsContainer">
        <div class="chart-card">
            <div class="chart-header"><h3>📈 Общая динамика ошибок по месяцам</h3></div>
            <canvas id="monthlyTrendChart"></canvas>
        </div>
        <div class="chart-card">
            <div class="chart-header"><h3>📡 Динамика по типам COPC</h3></div>
            <canvas id="typeTrendChart"></canvas>
        </div>
        <div id="errorsChartsContainer"></div>
    </div>
</div>
<div id="loadingOverlay" class="loading-overlay"><div>🔄 Синхронизация данных...</div></div>
<div id="loginModal" class="modal-overlay">
    <div class="modal-content">
        <h3>Вход для Администратора</h3>
        <input type="password" id="adminPassword" placeholder="Введите пароль" autocomplete="off">
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px;">
            <button id="confirmLoginBtn" class="btn-primary">Войти</button>
            <button id="cancelLoginBtn" class="btn-admin">Отмена</button>
        </div>
    </div>
</div>
<script>
    // === НАСТРОЙКИ FIREBASE ===
    const firebaseConfig = {
        apiKey: "AIzaSyAT5RRCgAJdoISSQMppfmSiiwANo8veW-A",
        authDomain: "itog-reestr.firebaseapp.com",
        projectId: "itog-reestr",
        storageBucket: "itog-reestr.firebasestorage.app",
        messagingSenderId: "676691874911",
        appId: "1:676691874911:web:d492661026f00e6b7ef7ea",
        measurementId: "G-XHD5XZFH93"
    };
    let app, db;
    let firebaseInitialized = false;
    let firebaseErrorDetected = false;
    // 1. Инициализация Firebase
    if (typeof firebase === 'undefined') {
        console.error("❌ Библиотека Firebase не загружена.");
        firebaseErrorDetected = true;
        alert("⚠️ Ошибка загрузки Firebase. Проверьте интернет.");
        throw new Error("Firebase not loaded");
    } else {
        try {
            app = firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            firebaseInitialized = true;
            console.log("✅ Firebase инициализирован успешно");
        } catch (error) {
            console.error("❌ Ошибка инициализации Firebase:", error);
            firebaseErrorDetected = true;
        }
    }
    const ADMIN_PASSWORD = "admin123";
    const DATA_DOC_ID = "analytics-data";
    // ИНИЦИАЛИЗАЦИЯ ДАННЫХ
    let rawData = [];
    let isAdmin = false;
    // Элементы DOM
    const fileInput = document.getElementById('uploadFileInput');
    const loadBtn = document.getElementById('loadFileBtn');
    const uploadStatusSpan = document.getElementById('uploadStatus');
    const filterMonth = document.getElementById('filterMonth');
    const filterGroup = document.getElementById('filterGroup');
    const filterCritical = document.getElementById('filterCritical');
    const filterType = document.getElementById('filterType');
    const resetBtn = document.getElementById('resetFiltersBtn');
    const errorsChartsContainer = document.getElementById('errorsChartsContainer');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const authControls = document.getElementById('authControls');
    const uploadSection = document.getElementById('uploadSection');
    const loginModal = document.getElementById('loginModal');
    const adminPasswordInput = document.getElementById('adminPassword');
    const confirmLoginBtn = document.getElementById('confirmLoginBtn');
    const cancelLoginBtn = document.getElementById('cancelLoginBtn');
    let monthlyChart = null, typeTrendChart = null, errorCharts = [];
    // === АВТОРИЗАЦИЯ ===
    function checkSession() {
        const storedIsAdmin = sessionStorage.getItem('isAdmin');
        isAdmin = storedIsAdmin === 'true';
        toggleAdminUI(isAdmin);
    }
    function toggleAdminUI(isAuth) {
        authControls.style.display = 'flex';
        if (isAuth) {
            loginBtn.style.display = 'none';
            loginBtn.disabled = true;
            logoutBtn.style.display = 'inline-block';
            uploadSection.style.display = 'flex';
        } else {
            loginBtn.style.display = 'inline-block';
            loginBtn.disabled = false;
            logoutBtn.style.display = 'none';
            uploadSection.style.display = 'none';
        }
    }
    // === ИНИЦИАЛИЗАЦИЯ СОБЫТИЙ ===
    function initEventListeners() {
        if (loginBtn) loginBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            loginModal.classList.add('active');
            adminPasswordInput.value = '';
            setTimeout(() => adminPasswordInput.focus(), 50);
        });
        if (confirmLoginBtn) confirmLoginBtn.addEventListener('click', () => {
            const pass = adminPasswordInput.value;
            if (pass === ADMIN_PASSWORD) {
                isAdmin = true;
                sessionStorage.setItem('isAdmin', 'true');
                toggleAdminUI(true);
                loginModal.classList.remove('active');
                alert("✅ Вы вошли как Администратор.");
            } else {
                alert("❌ Неверный пароль!");
                adminPasswordInput.value = '';
            }
        });
        if (logoutBtn) logoutBtn.addEventListener('click', () => {
            isAdmin = false;
            sessionStorage.removeItem('isAdmin');
            toggleAdminUI(false);
        });
        if (cancelLoginBtn) cancelLoginBtn.addEventListener('click', () => loginModal.classList.remove('active'));
        if (loginModal) loginModal.addEventListener('click', (e) => {
            if (e.target === loginModal) loginModal.classList.remove('active');
        });
        if (adminPasswordInput) adminPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') confirmLoginBtn.click();
        });
        if (loadBtn) loadBtn.addEventListener('click', () => fileInput.click());
        if (fileInput) fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) loadFileWithPassword(e.target.files[0]);
            fileInput.value = '';
        });
        if (filterMonth) filterMonth.addEventListener('change', applyFiltersAndRender);
        if (filterGroup) filterGroup.addEventListener('change', applyFiltersAndRender);
        if (filterCritical) filterCritical.addEventListener('change', applyFiltersAndRender);
        if (filterType) filterType.addEventListener('change', applyFiltersAndRender);
        if (resetBtn) resetBtn.addEventListener('click', resetFilters);
    }
    // === ОБРАБОТКА ДАННЫХ ===
    function normalizeString(str) {
        if (str === undefined || str === null) return "";
        let s = String(str);
        s = s.replace(/[\u00A0\t\n\r\f\v]+/g, ' ').trim();
        s = s.replace(/\s+/g, ' ');
        return s;
    }
    function parseExcelData(workbook) {
        if (!workbook || !workbook.Sheets || !workbook.SheetNames || workbook.SheetNames.length === 0) {
            console.error("❌ workbook некорректен");
            return [];
        }
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, { defval: "", blankrows: false });
        if (!json || !Array.isArray(json) || json.length === 0) return [];
        const results = [];
        for (let row of json) {
            const getVal = (keys) => {
                for (let k of keys) {
                    if (row[k] !== undefined && row[k] !== null) {
                        const v = normalizeString(row[k]);
                        if (v !== "") return v;
                    }
                }
                return "";
            };
            const month = getVal(["Месяц", "месяц", "Month", "месяцы"]);
            if (!month) continue;
            const group = getVal(["Группа ошибок", "ГруппаОшибок", "group", "Ошибка"]);
            const errorName = getVal(["Название ошибки", "Название", "Опис", "error"]);
            const criticalRaw = row["Критичность COPC"] || row["Критичность СОРС"] || row["критичность"] || "";
            const critical = normalizeString(criticalRaw);
            const typeRaw = row["Тип COPC"] || row["Тип СОРС"] || row["тип сорс"] || row["Тип"] || "";
            let type = normalizeString(typeRaw);
            let percentRaw = row["% отклонений от фонограмм"] || row["% отклонений"] || row["процент"] || row["%"] || "0";
            let percent = parseFloat(String(percentRaw).replace(',', '.').replace('%', ''));
            if (isNaN(percent)) percent = 0;
            let countRaw = row["Отклонений с влиянием (шт.)"] || row["Отклонений"] || row["кол-во"] || "0";
            let countVal = parseInt(String(countRaw).replace(/\D/g, ''));
            if (isNaN(countVal)) countVal = 0;
            results.push({ month, group, errorName, critical, type, percentDeviation: percent, deviationCount: countVal });
        }
        return results;
    }
    // === FIREBASE: СОХРАНЕНИЕ ===
    async function saveDataToFirebase(data) {
        if (!firebaseInitialized) {
            alert("Ошибка: Firebase не подключен.");
            return;
        }
        if (!Array.isArray(data)) {
            alert("❌ Ошибка данных: Файл не корректен.");
            return;
        }
        if (data.length === 0) {
            alert("Файл пуст или не содержит данных.");
            return;
        }
        showLoading(true);
        try {
            const dataRef = db.doc("analytics/" + DATA_DOC_ID);
            await dataRef.set({
                data: data,
                lastUpdated: new Date().toISOString()
            });
            rawData = data;
            uploadStatusSpan.innerText = `✅ ${data.length} записей сохранено`;
            uploadStatusSpan.style.color = "#ffcc00";
            rebuildFiltersFromData();
            applyFiltersAndRender();
            setTimeout(() => { if(isAdmin) uploadStatusSpan.innerText = "Готово"; }, 5000);
        } catch (error) {
            console.error("Error saving data:", error);
            uploadStatusSpan.innerText = "❌ Ошибка сохранения: " + error.message;
            uploadStatusSpan.style.color = "#ff4444";
            if (error.code === 'permission-denied') {
                alert("⛔ Ошибка доступа! Проверьте правила Firestore (Rules).");
            } else if (error.code === 'failed-precondition' || error.code === 'aborted') {
                 alert("⚠️ Ошибка сети. Проверьте подключение к интернету.");
            } else {
                 alert("Не удалось сохранить данные: " + error.message);
            }
        } finally {
            showLoading(false);
        }
    }
    // === FIREBASE: ЧТЕНИЕ (ИСПРАВЛЕНО) ===
    function handleNoData() {
        rawData = [];
        uploadStatusSpan.innerText = "Нет данных в облаке";
        uploadStatusSpan.style.color = "#b3b3b3";
        errorsChartsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">В файле пока нет данных.</div>';
        // Уничтожаем старые графики
        if (monthlyChart) { monthlyChart.destroy(); monthlyChart = null; }
        if (typeTrendChart) { typeTrendChart.destroy(); typeTrendChart = null; }
        if (errorCharts) {
            errorCharts.forEach(c => c.destroy());
            errorCharts = [];
        }
        // Сброс KPI
        const cards = document.querySelectorAll('#kpiContainer .kpi-card');
        if (cards.length >= 4) {
            cards[0].querySelector('.kpi-value').innerText = '—';
            cards[1].querySelector('.kpi-value').innerText = '—';
            cards[2].querySelector('.kpi-value').innerHTML = '—%';
            cards[3].querySelector('.kpi-value').innerText = '—';
        }
    }
    function updateDashboardFromSnapshot(docData) {
        // ИСПРАВЛЕНИЕ: Строгая проверка на null
        if (!docData) {
            console.log("Document does not exist.");
            handleNoData();
            return;
        }
        // ИСПРАВЛЕНИЕ: Проверка поля data внутри документа
        const data = docData.data;
        if (!data) {
            console.log("Document exists but 'data' field is missing.");
            handleNoData();
            return;
        }
        // ИСПРАВЛЕНИЕ: Проверка на массив
        if (!Array.isArray(data)) {
            console.error("Data field is not an array:", data);
            handleNoData();
            return;
        }
        if (data.length === 0) {
            handleNoData();
            return;
        }
        // Обновляем rawData, если данные изменились
        if (JSON.stringify(rawData) !== JSON.stringify(data)) {
            rawData = data;
            rebuildFiltersFromData();
            applyFiltersAndRender();
            uploadStatusSpan.innerText = "Данные загружены";
            uploadStatusSpan.style.color = "#ffcc00";
        }
    }
    function startListening() {
        if (!firebaseInitialized || !db) {
            console.log("Firebase не инициализирован, слушатель не запущен.");
            return;
        }
        const dataRef = db.doc("analytics/" + DATA_DOC_ID);
        dataRef.onSnapshot(
            (docSnapshot) => {
                const docData = docSnapshot.exists ? docSnapshot.data() : null;
                updateDashboardFromSnapshot(docData);
            },
            (error) => {
                console.warn("Firestore listener error (CORS/Network):", error.message);
                errorsChartsContainer.innerHTML = `<div style="text-align:center; padding:20px; color:#ff4444;">Не удалось загрузить данные: ${error.message}<br>Проверьте правила Firestore или подключение.</div>`;
                if (monthlyChart) { monthlyChart.destroy(); monthlyChart = null; }
                if (typeTrendChart) { typeTrendChart.destroy(); typeTrendChart = null; }
                if (errorCharts) {
                    errorCharts.forEach(c => c.destroy());
                    errorCharts = [];
                }
            }
        );
    }
    // === ЛОГИКА ОТОБРАЖЕНИЯ ===
    function rebuildFiltersFromData() {
        if (!rawData || !Array.isArray(rawData) || rawData.length === 0) return;
        const monthsSet = new Set();
        const groupsSet = new Set();
        const criticalSet = new Set();
        const typesSet = new Set();
        for (let row of rawData) {
            if (row.month) monthsSet.add(row.month);
            if (row.group) groupsSet.add(row.group);
            if (row.critical && row.critical !== "") criticalSet.add(row.critical);
            if (row.type && row.type !== "") typesSet.add(row.type);
        }
        const monthOrder = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
        let monthHtml = '<option value="all">Все месяцы</option>';
        Array.from(monthsSet).sort((a,b) => monthOrder.indexOf(a) - monthOrder.indexOf(b)).forEach(m => {
            monthHtml += `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`;
        });
        filterMonth.innerHTML = monthHtml;
        let groupHtml = '<option value="all">Все группы</option>';
        Array.from(groupsSet).sort().forEach(g => {
            groupHtml += `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`;
        });
        filterGroup.innerHTML = groupHtml;
        let critHtml = '<option value="all">Все</option>';
        Array.from(criticalSet).sort().forEach(c => {
            critHtml += `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`;
        });
        filterCritical.innerHTML = critHtml;
        let typeHtml = '<option value="all">Все типы</option>';
        if (typesSet.size === 0) {
            typeHtml = '<option value="all">Нет данных</option>';
        } else {
            Array.from(typesSet).sort().forEach(t => {
                if (t && t !== "") typeHtml += `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`;
            });
        }
        filterType.innerHTML = typeHtml;
    }
    function getFilteredData() {
        if (!rawData || !Array.isArray(rawData)) return [];
        const monthVal = filterMonth.value;
        const groupVal = filterGroup.value;
        const criticalVal = filterCritical.value;
        const typeVal = filterType.value;
        return rawData.filter(row => {
            if (monthVal !== "all" && row.month !== monthVal) return false;
            if (groupVal !== "all" && row.group !== groupVal) return false;
            if (criticalVal !== "all" && row.critical !== criticalVal) return false;
            if (typeVal !== "all" && (!row.type || !row.type.includes(typeVal))) return false;
            return true;
        });
    }
    function computeAggregates(filteredData) {
        if (!filteredData || !Array.isArray(filteredData) || filteredData.length === 0) return { monthsSet: new Set(), totalErrorsCleaned: 0, avgPercentAll: 0, uniqueGroups: 0 };
        const monthsSet = new Set();
        let totalErrorsCleaned = 0;
        let sumPercent = 0;
        const groupsSet = new Set();
        for (let row of filteredData) {
            if (row.month) monthsSet.add(row.month);
            if (row.group) groupsSet.add(row.group);
            sumPercent += (row.percentDeviation || 0);
            if (row.critical !== "-") totalErrorsCleaned += (row.deviationCount || 0);
        }
        return {
            monthsSet,
            totalErrorsCleaned,
            avgPercentAll: filteredData.length > 0 ? sumPercent / filteredData.length : 0,
            uniqueGroups: groupsSet.size
        };
    }
    function renderKPI(agg) {
        const cards = document.querySelectorAll('#kpiContainer .kpi-card');
        if (cards.length >= 4) {
            cards[0].querySelector('.kpi-value').innerText = agg.monthsSet.size || '—';
            cards[1].querySelector('.kpi-value').innerText = agg.totalErrorsCleaned.toLocaleString();
            cards[2].querySelector('.kpi-value').innerHTML = (isNaN(agg.avgPercentAll) || !isFinite(agg.avgPercentAll) ? '—%' : agg.avgPercentAll.toFixed(2) + '%');
            cards[3].querySelector('.kpi-value').innerText = agg.uniqueGroups;
        }
    }
    function getLineColor() { return '#0055aa'; }
    function getBarColor() { return '#ffcc00'; }
    function getRandomColor() {
        const hue = Math.floor(Math.random() * 360);
        return `hsl(${hue}, 70%, 60%)`;
    }
    function getMinMax(datasets) {
        let max = -Infinity, min = Infinity;
        if (!datasets) return { min: 0, max: 100 };
        datasets.forEach(ds => {
            if (!ds || !ds.data) return;
            ds.data.forEach(val => {
                if (val !== undefined && val !== null) {
                    if (val > max) max = val;
                    if (val < min) min = val;
                }
            });
        });
        if (max === -Infinity) max = 100;
        if (min === Infinity) min = 0;
        const range = max - min;
        const padding = range * 0.15;
        return { min: min - padding, max: max + padding };
    }
    function renderMonthlyTrend(filteredData) {
        if (!filteredData || filteredData.length === 0) return;
        const monthMap = new Map();
        for (let row of filteredData) {
            if (!monthMap.has(row.month)) monthMap.set(row.month, { sumPercent: 0, count: 0, sumErrors: 0 });
            const m = monthMap.get(row.month);
            m.sumPercent += (row.percentDeviation || 0);
            m.count += 1;
            if (row.critical !== "-") m.sumErrors += (row.deviationCount || 0);
        }
        const monthOrder = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
        let months = Array.from(monthMap.keys()).sort((a,b) => monthOrder.indexOf(a) - monthOrder.indexOf(b));
        const countData = months.map(m => monthMap.get(m).sumErrors);
        const percentData = months.map(m => monthMap.get(m).sumPercent / monthMap.get(m).count);
        const countLimits = getMinMax([{data: countData}]);
        const percentLimits = getMinMax([{data: percentData}]);
        if (monthlyChart) monthlyChart.destroy();
        const ctx = document.getElementById('monthlyTrendChart');
        if (!ctx) return;
        monthlyChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: months,
                datasets: [
                    { label: '% отклонений', data: percentData, type: 'line', borderColor: getLineColor(), borderWidth: 2, tension: 0.4, fill: false, pointRadius: 4, pointHoverRadius: 6, yAxisID: 'y1' },
                    { label: 'Отклонений (шт.)', data: countData, type: 'bar', backgroundColor: getBarColor(), borderColor: getBarColor(), borderWidth: 0, barPercentage: 0.6, categoryPercentage: 0.8 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                scales: {
                    y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Кол-во ошибок' }, min: countLimits.min, max: countLimits.max, grid: { color: '#444' }, ticks: { color: '#fff' } },
                    y1: { type: 'linear', display: true, position: 'right', title: { display: true, text: '% отклонений' }, min: percentLimits.min, max: percentLimits.max, grid: { drawOnChartArea: false, color: '#444' }, ticks: { color: '#aaa' }, border: { color: '#aaa' } },
                    x: { ticks: { color: '#fff' }, grid: { display: false } }
                },
                plugins: { legend: { labels: { color: '#fff' } } }
            }
        });
    }
    // === ИСПРАВЛЕННАЯ ФУНКЦИЯ: renderTypeTrend ===
    function renderTypeTrend(filteredData) {
        if (!filteredData || !Array.isArray(filteredData)) {
            console.warn("renderTypeTrend: invalid filteredData");
            if (monthlyChart) { monthlyChart.destroy(); monthlyChart = null; }
            if (typeTrendChart) { typeTrendChart.destroy(); typeTrendChart = null; }
            if (errorCharts) {
                errorCharts.forEach(c => c.destroy());
                errorCharts = [];
            }
            errorsChartsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Нет данных для графика</div>';
            return;
        }

        if (filteredData.length === 0) {
            errorsChartsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Нет данных по выбранным фильтрам</div>';
            return;
        }

        const typeMonthMap = new Map();
        for (let row of filteredData) {
            if (!row.type) continue;
            if (!typeMonthMap.has(row.type)) {
                typeMonthMap.set(row.type, new Map());
            }
            const typeMap = typeMonthMap.get(row.type);
            if (!typeMap.has(row.month)) {
                typeMap.set(row.month, { sumPercent: 0, count: 0, sumErrors: 0 });
            }
            const data = typeMap.get(row.month);
            if (data) {
                data.sumPercent += (row.percentDeviation || 0);
                data.count += 1;
                if (row.critical !== "-") {
                    data.sumErrors += (row.deviationCount || 0);
                }
            }
        }

        const monthOrder = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
        const allMonths = new Set();
        
        if (typeMonthMap) {
            typeMonthMap.forEach((m) => {
                if (m) m.forEach((_, month) => allMonths.add(month));
            });
        }
        
        const months = Array.from(allMonths).sort((a,b) => monthOrder.indexOf(a) - monthOrder.indexOf(b));
        
        if (months.length === 0) {
             errorsChartsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Нет временных меток в данных</div>';
             return;
        }

        const datasets = [];
        
        if (typeMonthMap) {
            typeMonthMap.forEach((dataMap, typeLabel) => {
                if (!dataMap) return;

                const percentData = months.map(m => { 
                    const d = dataMap.get(m); 
                    return (d && d.count > 0) ? (d.sumPercent / d.count) : 0; 
                });
                const countData = months.map(m => { 
                    const d = dataMap.get(m); 
                    return (d) ? d.sumErrors : 0; 
                });
                
                const hue = Math.floor(Math.random() * 360);
                const color = `hsl(${hue}, 70%, 60%)`;

                datasets.push({ label: `${typeLabel} (%)`, data: percentData, type: 'line', borderColor: color, borderWidth: 1, tension: 0.3, fill: false, pointRadius: 2, yAxisID: 'y1' });
                datasets.push({ label: `${typeLabel} (шт)`, data: countData, type: 'bar', backgroundColor: color, borderColor: color, borderWidth: 0, barPercentage: 0.5, categoryPercentage: 0.8 });
            });
        }

        if (months.length === 0) return;

        const limitsY = getMinMax(datasets.filter(d => d.type === 'bar'));
        const limitsY1 = getMinMax(datasets.filter(d => d.type === 'line'));

        if (typeTrendChart) typeTrendChart.destroy();
        const ctx = document.getElementById('typeTrendChart');
        if (!ctx) return;

        typeTrendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: months,
                datasets: datasets.length > 0 ? datasets : [{ label: 'Нет данных', data: months.map(() => 0), borderColor: '#ffcc00', borderWidth: 2, tension: 0, fill: false }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                scales: {
                    y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Кол-во ошибок' }, min: limitsY.min, max: limitsY.max, grid: { color: '#444' }, ticks: { color: '#fff' } },
                    y1: { type: 'linear', display: true, position: 'right', title: { display: true, text: '% отклонений' }, min: limitsY1.min, max: limitsY1.max, grid: { drawOnChartArea: false }, ticks: { color: '#aaa' } },
                    x: { ticks: { color: '#fff' }, grid: { display: false } }
                },
                plugins: { legend: { labels: { color: '#fff', font: { size: 12 } } } }
            }
        });
    }
    // === ИСПРАВЛЕННАЯ ФУНКЦИЯ: renderErrorCharts ===
    function renderErrorCharts(filteredData) {
        if (!filteredData || !Array.isArray(filteredData)) {
            console.warn("renderErrorCharts: invalid data");
            return;
        }
        if (filteredData.length === 0) {
            errorsChartsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Нет данных по выбранным фильтрам</div>';
            return;
        }

        errorsChartsContainer.innerHTML = '';
        if (errorCharts) {
            errorCharts.forEach(chart => { if (chart && typeof chart.destroy === 'function') chart.destroy(); });
            errorCharts = [];
        }

        const errorMap = new Map();
        for (let row of filteredData) {
            if (!row.errorName) continue;
            if (!errorMap.has(row.errorName)) {
                errorMap.set(row.errorName, new Map());
            }
            const dataMap = errorMap.get(row.errorName);
            if (!dataMap.has(row.month)) {
                dataMap.set(row.month, { sumPercent: 0, count: 0, sumErrors: 0 });
            }
            const data = dataMap.get(row.month);
            if (data) {
                data.sumPercent += (row.percentDeviation || 0);
                data.count += 1;
                if (row.critical !== "-") data.sumErrors += (row.deviationCount || 0);
            }
        }

        if (errorMap.size === 0) return;

        const limit = 5;
        let errorsToShow = Array.from(errorMap.keys());
        if (errorsToShow.length > limit) {
            errorsToShow = errorsToShow.slice(0, limit);
            errorsToShow.push("...и другие (лимит 5)");
        }

        errorsToShow.forEach(errorName => {
            if (errorName === "...и другие (лимит 5)") {
                const div = document.createElement('div');
                div.className = 'chart-card';
                div.style.padding = '20px';
                div.innerHTML = '<h3 style="text-align:center; color:#666;">Показаны топ-5 ошибок по частоте</h3>';
                errorsChartsContainer.appendChild(div);
                return;
            }
            
            const dataMap = errorMap.get(errorName);
            if (!dataMap) return;

            const monthOrder = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
            const allMonths = new Set();
            dataMap.forEach((_, month) => allMonths.add(month));
            
            const months = Array.from(allMonths).sort((a,b) => monthOrder.indexOf(a) - monthOrder.indexOf(b));
            if (months.length === 0) return;

            const percentData = months.map(m => { 
                const d = dataMap.get(m); 
                return (d && d.count > 0) ? (d.sumPercent / d.count) : 0; 
            });
            const countData = months.map(m => { 
                const d = dataMap.get(m); 
                return (d) ? d.sumErrors : 0; 
            });

            const countLimits = getMinMax([{data: countData}]);
            const percentLimits = getMinMax([{data: percentData}]);

            const card = document.createElement('div');
            card.className = 'chart-card';
            const safeName = errorName.replace(/[^a-z0-9]/gi, '_');
            card.innerHTML = `<div class="chart-header"><h3>🚨 Динамика ошибки: ${escapeHtml(errorName)}</h3></div><canvas id="errorChart_${safeName}"></canvas>`;
            errorsChartsContainer.appendChild(card);

            const canvasElement = document.getElementById(`errorChart_${safeName}`);
            if (!canvasElement) {
                console.error("Canvas not found:", safeName);
                return;
            }
            const ctx = canvasElement.getContext('2d');
            
            try {
                const chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: months,
                        datasets: [
                            { label: 'Отклонений (шт.)', data: countData, type: 'bar', backgroundColor: getBarColor(), borderColor: getBarColor(), borderWidth: 0, barPercentage: 0.6 },
                            { label: '% отклонений', data: percentData, type: 'line', borderColor: getLineColor(), borderWidth: 2, tension: 0.4, fill: false, pointRadius: 3, yAxisID: 'y1' }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            y: { display: true, grid: { color: '#444' }, ticks: { color: '#fff' }, position: 'left', title: { display: true, text: 'Кол-во ошибок' }, min: countLimits.min, max: countLimits.max },
                            y1: { display: true, grid: { drawOnChartArea: false, color: '#444' }, ticks: { color: '#aaa' }, position: 'right', title: { display: true, text: '% отклонений' }, min: percentLimits.min, max: percentLimits.max },
                            x: { ticks: { color: '#fff' }, grid: { display: false } }
                        },
                        plugins: { legend: { display: true, labels: { color: '#fff' } }, title: { display: false } }
                    }
                });
                errorCharts.push(chart);
            } catch (chartErr) {
                console.error("Ошибка создания графика:", errorName, chartErr);
            }
        });
    }
    function applyFiltersAndRender() {
        if (!rawData || !Array.isArray(rawData) || rawData.length === 0) {
            errorsChartsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Нет данных для отображения. Загрузите файл.</div>';
            return;
        }
        const filtered = getFilteredData();
        const agg = computeAggregates(filtered);
        renderKPI(agg);
        if (filtered.length === 0) {
            if (monthlyChart) { monthlyChart.destroy(); monthlyChart = null; }
            if (typeTrendChart) { typeTrendChart.destroy(); typeTrendChart = null; }
            if (errorCharts) {
                errorCharts.forEach(c => c.destroy());
                errorCharts = [];
            }
            errorsChartsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Нет данных по выбранным фильтрам</div>';
            return;
        }
        renderMonthlyTrend(filtered);
        renderTypeTrend(filtered);
        renderErrorCharts(filtered);
    }
    function resetFilters() {
        filterMonth.value = "all";
        filterGroup.value = "all";
        filterCritical.value = "all";
        filterType.value = "all";
        applyFiltersAndRender();
    }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    function showLoading(show) {
        if (show) loadingOverlay.classList.add('active');
        else loadingOverlay.classList.remove('active');
    }
    function loadFileWithPassword(file) {
        if (!isAdmin) {
            alert("⛔ Доступ запрещен! Войдите как администратор.");
            return;
        }
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const parsed = parseExcelData(workbook);
                if (parsed.length === 0) {
                    alert("Файл пуст или структура не найдена. Убедитесь, что есть заголовки: Месяц, Группа ошибок...");
                    uploadStatusSpan.innerText = "❌ Пустой файл";
                    uploadStatusSpan.style.color = "#ff4444";
                    return;
                }
                uploadStatusSpan.innerText = `⏳ Загрузка в облако... (${parsed.length} записей)`;
                uploadStatusSpan.style.color = "#ffcc00";
                saveDataToFirebase(parsed);
            } catch (err) {
                console.error(err);
                alert("Ошибка чтения: " + err.message);
                uploadStatusSpan.innerText = "❌ Ошибка файла";
                uploadStatusSpan.style.color = "#ff4444";
            }
        };
        reader.onerror = function() {
            alert("Ошибка чтения файла.");
        };
        reader.readAsArrayBuffer(file);
    }
    function initApp() {
        checkSession();
        initEventListeners();
        startListening();
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
    } else {
        initApp();
    }
</script>
